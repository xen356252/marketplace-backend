server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html